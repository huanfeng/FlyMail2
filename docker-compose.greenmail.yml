# GreenMail 叠加编排：给已部署的 FlyMail 接一台一次性邮件服务器。
#
# 用途有两个：
#   1. 在真实部署形态下走通收发链路，不需要任何真实邮箱凭据
#   2. 在没有 Go 工具链的机器上验证部署（`e2e.sh` 跑的是宿主机的 go test，
#      要求装了 Go；这套编排不要求）
#
# 使用方式（在仓库根目录，与主编排叠加）：
#   docker compose -f docker-compose.yml -f docker-compose.greenmail.yml up -d
#   ./scripts/greenmail-smoke.sh          # 自动走一遍收发
#   docker compose -f docker-compose.yml -f docker-compose.greenmail.yml down
#
# 容器之间走 compose 默认网络，FlyMail 里把账户的 IMAP/SMTP 主机填 `greenmail`。
# 宿主端口只绑 127.0.0.1：这是一台**关闭了鉴权**的测试邮件服务器，
# 任何用户名密码都能登录，绝不能让它对局域网可见。

services:
  greenmail:
    image: greenmail/standalone:2.1.8
    container_name: flymail-greenmail
    restart: unless-stopped
    ports:
      - "127.0.0.1:${GREENMAIL_SMTP_PORT:-3025}:3025"   # SMTP
      - "127.0.0.1:${GREENMAIL_IMAP_PORT:-3143}:3143"   # IMAP
      - "127.0.0.1:${GREENMAIL_API_PORT:-3080}:8080"    # REST API（投递测试邮件用）
    environment:
      # auth.disabled：任意账号密码均可登录，省去建用户的步骤
      GREENMAIL_OPTS: "-Dgreenmail.setup.test.all -Dgreenmail.hostname=0.0.0.0 -Dgreenmail.auth.disabled -Dgreenmail.verbose"
    healthcheck:
      # 这个镜像里只有 bash——没有 wget / curl / nc，所以用 bash 的 /dev/tcp 自己发一次
      # HTTP 请求。只探端口通不通不够：8080 监听起来之后 REST 还要一会儿才响应。
      test:
        - CMD
        - bash
        - -c
        - 'exec 3<>/dev/tcp/127.0.0.1/8080 && printf "GET /api/service/readiness HTTP/1.0\r\n\r\n" >&3 && head -1 <&3 | grep -q " 200"'
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  flymail:
    depends_on:
      greenmail:
        condition: service_healthy
