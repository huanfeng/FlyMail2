<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!-- 内联而不是引一个文件：首屏就得是 FlyMail 自己的图标（此前是 Vite 脚手架的默认图），
         而且少一次请求。有未读时 useUnreadBadge 会用 canvas 画一张带角标的 PNG 换掉它，
         两处的配色与字形保持一致。 -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232f6df6'/%3E%3Ctext x='32' y='46' font-family='system-ui,sans-serif' font-size='40' font-weight='bold' fill='white' text-anchor='middle'%3EF%3C/text%3E%3C/svg%3E" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#fbfaf7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1a1917" media="(prefers-color-scheme: dark)" />
    <title>FlyMail</title>
    <!--
      主题引导：必须在这里内联跑，不能等 main.tsx。
      bundle 解析完才应用主题的话，暗色用户每次刷新都先吃一帧白闪。
      逻辑要与 src/lib/theme.ts 的 getTheme() 保持一致——那边是权威，这里只是提前量。
    -->
    <script>
      (function () {
        try {
          var mode = localStorage.getItem('flymail_theme_mode')
          if (mode !== 'dark' && mode !== 'light') {
            // 没存过偏好就跟随系统，而不是一律亮色
            mode = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
          }
          var tone = localStorage.getItem('flymail_theme_tone') || 'slate'
          document.documentElement.setAttribute('data-mode', mode)
          document.documentElement.setAttribute('data-theme', tone)
        } catch (e) {
          /* 隐私模式下 localStorage 可能抛异常，忽略即可，主题回到默认 */
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
