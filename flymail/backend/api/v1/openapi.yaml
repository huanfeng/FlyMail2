                description:
                  type: string
                  description: 任务描述
                is_active:
                  type: boolean
                  description: 是否激活
                priority:
                  type: string
                  enum: [high, normal, low]
                  description: 任务优先级
                loop_interval:
                  type: integer
                  description: 循环间隔（秒），仅 loop 类型可更新
                cron_expression:
                  type: string
